
<!-- Back Button  -->
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Detalles</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Content Detail Element  -->
<ion-content class="ion-padding">

  @if (elemento) {
    <ion-card>
      <ion-card-header>
        <ion-card-title>
          {{ elemento.nombre }}
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <p>{{ elemento.descripcion }}</p>
        <p><strong>Categoría:</strong> {{ elemento.categoria }}</p>
        <p><strong>ID:</strong> {{ elemento.id }}</p>
      </ion-card-content>
    </ion-card>
  } @else {
    <p>No se ha encontrado el elemento seleccionado.</p>
  }

</ion-content>
